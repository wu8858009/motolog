// ---------------------------------------------------------------- 故障排除（內容由電腦版提供）
let faultQ = "", faultCat = "all";
const FAULT_LEVELS = { danger: ["⚠ 立即處理", "c-danger"], warn: ["盡快檢修", "c-warn"], info: ["注意", ""] };
function pFault(v, p) {
  const g = S.fault_guide;
  if (!g) { v.innerHTML = head(p) + `<div class="card empty">請更新電腦版 MotoLog 後再開啟</div>`; return; }
  v.innerHTML = head(p) + `
    <div class="card" style="border-left:4px solid var(--warn)"><div class="sub">適用：${esc(g.model)}<br>${esc(g.notice)}</div>
      <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">
        <a class="btn primary sm" href="${esc(g.manual_url)}" target="_blank" rel="noopener">📄 原廠使用說明書</a>
        <button class="btn sm" onclick="faultSteps()">🔢 怎麼讀閃爍碼</button></div></div>
    <div class="card"><input id="faultQ" placeholder="輸入閃爍碼（例如 4）或關鍵字" value="${esc(faultQ)}" style="width:100%">
      <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">${[["all", "全部"], ...g.sections.map(x => [x.key, x.title])].map(([k, t]) =>
        `<button class="btn sm ${faultCat === k ? "primary" : ""}" onclick="faultCat='${k}';render()">${esc(t)}</button>`).join("")}</div></div>
    <div id="faultList"></div>`;
  const q = $("#faultQ");
  q.oninput = () => { faultQ = q.value; drawFault(); };
  drawFault();
}
function drawFault() {
  const g = S.fault_guide, q = faultQ.trim();
  const rows = g.sections.filter(sec => faultCat === "all" || faultCat === sec.key).flatMap(sec => sec.items
    .filter(it => !q || (/^\d+$/.test(q) ? it.code && +q === +it.code : `${it.code} ${it.name} ${it.detail} ${it.action}`.includes(q)))  // 數字只比對閃爍碼
    .map(it => [sec, it]));
  $("#faultList").innerHTML = rows.length ? rows.map(([sec, it]) => `
    <details class="card"${rows.length === 1 ? " open" : ""}><summary><b class="${FAULT_LEVELS[it.level][1]}">${it.code ? `【${esc(it.code)}】` : ""}${esc(it.name)}</b>
      <span class="sub"> · ${FAULT_LEVELS[it.level][0]}</span></summary>
      <p>${esc(it.detail)}</p><p><b>▶ 處理：</b>${esc(it.action)}</p><p class="sub">資料來源：${esc(sec.src)}</p></details>`).join("")
    : `<div class="card empty">找不到符合的項目；閃爍碼請輸入數字，例如 4 或 12</div>`;
}
function faultSteps() {
  alert("怎麼讀故障燈閃爍碼\n\n" + S.fault_guide.read_steps.map((x, i) => `${i + 1}. ${x}`).join("\n") +
    "\n\n※ 此為同系統噴射車常見的手動讀碼方式，七期車款不一定適用；讀不到或碼不符時，請以三陽經銷商的噴射系統診斷器為準。");
}

// ---------------------------------------------------------------- 表單（底部 sheet）
let sheetSubmit = null;
function openSheet(title, body, onSubmit, onDelete, onOpen) {
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = body + `<p class="err" id="sheetErr"></p>`;
  $("#sheetFoot").innerHTML = (onDelete ? `<button type="button" class="btn danger" id="sheetDel">刪除</button>` : "") +
    `<button type="button" class="btn" id="sheetCancel">取消</button><button class="btn primary" id="sheetOk">儲存</button>`;
  sheetSubmit = onSubmit;
  if (onDelete) $("#sheetDel").onclick = onDelete;
  $("#sheetCancel").onclick = closeSheet;
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
  onOpen?.($("#sheetForm"));
}
function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; }
$("#sheetClose").onclick = closeSheet;
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#mapx").hidden) mapClose();  // 地圖疊在表單上：先關地圖
  else if (!$("#sheet").hidden) closeSheet();
});
$("#sheetForm").onsubmit = async e => {
  e.preventDefault();
  const form = e.target, data = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox" && el.name === "items") { (data.items ||= []); if (el.checked) data.items.push(el.value); }
    else if (el.type === "checkbox") data[el.name] = el.checked ? 1 : 0;
    else data[el.name] = el.value;
  }
  const ok = $("#sheetOk");
  ok.disabled = true;
  try { const res = await sheetSubmit(data); if (res) closeSheet(); }
  catch (err) { $("#sheetErr").textContent = err.message; }
  finally { ok.disabled = false; }
};

// ---------------------------------------------------------------- 地圖選加油站／機車行
// 名單與桌面版相同（stations_tw.json / shops_tw.json，由電腦或 GitHub Pages 提供），圖磚用 OpenStreetMap
const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
const MAP_KINDS = {
  fuel: { noun: "加油站", file: "stations_tw.json", key: "stations", recent: () => S.recent_stations,
    colors: [["中油", "#2563eb"], ["台塑", "#dc2626"], ["台亞", "#ec4899"], ["福懋", "#f97316"], ["全國", "#16a34a"],
      ["統一", "#14b8a6"], ["台糖", "#7c3aed"]] },
  shop: { noun: "機車行", file: "shops_tw.json", key: "shops", recent: () => S.recent_shops,
    colors: [["光陽|kymco", "#16a34a"], ["三陽|sym", "#2563eb"], ["山葉|yamaha", "#dc2626"], ["gogoro", "#14b8a6"],
      ["宏佳騰|aeon", "#f97316"], ["比雅久|pgo", "#a855f7"], ["鈴木|suzuki", "#ec4899"]] },
};
const MX = { map: null, layer: null, kind: null, input: null, places: [], sel: null, me: null, addr: "", browse: false, meM: null, accC: null, msgT: 0, watch: null, watchT: 0, dragged: false };
const norm = s => String(s ?? "").toLowerCase().replace(/臺/g, "台");

function placeField(label, name, kind, value, recent) {
  return `<div class="f"><span>${label}</span><div class="with-btn">
    <input name="${name}" list="${name}List" value="${esc(value)}" autocomplete="off" aria-label="${label}">
    <button type="button" class="btn" onclick="pickPlace('${kind}', this.previousElementSibling)">🗺 地圖</button></div>
    <datalist id="${name}List">${(recent || []).map(s => `<option value="${esc(s)}">`).join("")}</datalist></div>`;
}

let leafletP = null;
function loadLeaflet() {
  return leafletP ||= new Promise((ok, no) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = LEAFLET + "leaflet.min.css";
    const js = document.createElement("script");
    js.src = LEAFLET + "leaflet.min.js"; js.onload = ok;
    js.onerror = () => { leafletP = null; css.remove(); js.remove(); no(new Error("地圖元件載入失敗，請確認網路連線")); };
    document.head.append(css, js);
  });
}
const placeData = {};
function loadPlaces(kind) {
  const k = MAP_KINDS[kind];
  return placeData[kind] ||= fetch(k.file).then(r => { if (!r.ok) throw 0; return r.json(); })
    // 存進紀錄的名稱與桌面版相同：只有品牌名時補上地址以便辨識
    .then(j => j[k.key].map(p => ({ ...p, label: p.name === p.brand && p.addr ? `${p.name}（${p.addr}）` : p.name || "（未命名）" })))
    .catch(() => { delete placeData[kind]; throw new Error(`${k.noun}名單載入失敗，請確認網路連線`); });
}

const distKm = (a, b) => {
  const r = Math.PI / 180, h = Math.sin((b.lat - a.lat) * r / 2) ** 2 +
    Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lon - a.lon) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};
const distTxt = d => d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(1)} km`;
function mapMsg(t, ms) {
  clearTimeout(MX.msgT);
  $("#mapxMsg").textContent = t;
  if (ms) MX.msgT = setTimeout(() => { $("#mapxMsg").textContent = ""; }, ms);
}

// input：要填入的欄位；沒有欄位＝「附近地圖」瀏覽模式。switching：瀏覽模式切換加油站／機車行，保留目前位置與地圖範圍
async function pickPlace(kind, input = null, switching = false) {
  const k = MAP_KINDS[kind];
  Object.assign(MX, { kind, input, browse: !input, sel: null, places: [] });
  if (!switching) {
    MX.me = null; MX.addr = "";
    MX.meM?.remove(); MX.accC?.remove();
    mapMeChip();
  }
  $("#mapxKind").hidden = !MX.browse;
  for (const b of $("#mapxKind").children) b.classList.toggle("on", b.dataset.k === kind);
  $("#mapxUse").textContent = MX.browse ? "🧭 導航" : "使用";
  $("#mapx").hidden = false;
  $("#mapxQ").value = ""; $("#mapxQ").placeholder = `搜尋${k.noun}名稱或地址`;
  $("#mapxRes").hidden = true;
  mapSelect(null);
  mapMsg("載入中…");
  try {
    const [, places] = await Promise.all([loadLeaflet(), loadPlaces(kind)]);
    if ($("#mapx").hidden || MX.kind !== kind) return;
    MX.places = places;
    mapInit();
    mapMsg("");
    if (switching) { if (MX.me) mapNearby(); return; }
    // 欄位已有名稱 → 直接定位到該處；否則先看最近去過的。兩種情況都會偵測目前位置並列出附近的店家／加油站
    const find = n => n && places.find(p => p.label === n || p.name === n);
    const hit = find(input?.value.trim());
    const recent = !hit && (k.recent() || []).map(find).find(Boolean);
    if (hit) { MX.map.setView([hit.lat, hit.lon], 16); mapSelect(hit); }
    else MX.map.setView(recent ? [recent.lat, recent.lon] : [23.7, 120.95], recent ? 14 : 7);
    mapLocate(true);
  } catch (e) { mapMsg(e.message); }
}

function mapInit() {
  $("#mapx").classList.toggle("mapx-dark", getComputedStyle(document.documentElement).colorScheme === "dark");
  if (!MX.map) {
    MX.map = L.map("mapxMap", { zoomControl: false, renderer: L.canvas({ tolerance: 10 }) });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(MX.map);
    MX.layer = L.layerGroup().addTo(MX.map);
    MX.map.on("click", () => { $("#mapxRes").hidden = true; });
    MX.map.on("dragstart", () => { MX.dragged = true; });  // 使用者自己拖曳後，定位校正就不再移動地圖
  }
  MX.map.invalidateSize();
  MX.layer.clearLayers();
  const colors = MAP_KINDS[MX.kind].colors;
  for (const p of MX.places) {
    const t = norm(`${p.brand} ${p.name}`);
    const color = (colors.find(([w]) => w.split("|").some(x => t.includes(x))) || [, "#94a3b8"])[1];
    p._m = L.circleMarker([p.lat, p.lon], { radius: 7, color: "#0f172a", weight: 1, fillColor: color, fillOpacity: .9 })
      .on("click", e => { L.DomEvent.stopPropagation(e); mapSelect(p); }).addTo(MX.layer);
  }
}

function mapSelect(p) {
  const style = on => on ? { radius: 11, color: "#fff", weight: 3 } : { radius: 7, color: "#0f172a", weight: 1 };
  MX.sel?._m?.setStyle(style(false));
  MX.sel = p;
  if (p?._m) { p._m.setStyle(style(true)); p._m.bringToFront(); }
  const info = p && [p.addr || "（地圖資料未提供地址）", p.phone, MX.me && (MX.me.rough ? "約 " : "") + distTxt(distKm(MX.me, p))].filter(Boolean).join(" · ");
  $("#mapxSel").innerHTML = p ? `<div class="n">${esc(p.label)}</div><div class="a">${esc(info)}</div>`
    : `<div class="a">點選地圖上的${MAP_KINDS[MX.kind]?.noun || ""}${MX.browse ? "查看資訊" : ""}，或在上方搜尋</div>`;
  $("#mapxUse").disabled = !p;
}

// 持續 GPS 定位：手機先給的常是 Wi-Fi／基地台推估（偏差大），之後才收到衛星定位；
// 只採用越來越準的位置，精準度到 ±50 m 內或 25 秒後停止。不用快取的舊位置，也不用 IP 推估（常差好幾公里）
const GOOD_ACC = 50, ROUGH_ACC = 150;
function mapStopLocate() {
  if (MX.watch != null) navigator.geolocation.clearWatch(MX.watch);
  clearTimeout(MX.watchT);
  MX.watch = null;
}
function mapLocate(auto) {
  mapStopLocate();
  if (!navigator.geolocation || !window.isSecureContext) {  // 瀏覽器只允許 HTTPS 網頁使用 GPS
    mapMsg("這個網址是 http，手機不允許 GPS 定位；請改用雲端同步（https）網址開啟", 7000);
    return;
  }
  const live = () => !$("#mapx").hidden && MX.map;
  const keep = auto && MX.sel;  // 欄位原本就有名稱：只更新距離，不移動地圖也不改選取
  let best = null;
  MX.dragged = false;
  mapMsg("GPS 定位中…");
  if (!MX.me) { $("#mapxMe").hidden = false; $("#mapxMe").innerHTML = `<span class="t">📍 正在取得目前位置…</span>`; }
  const settle = () => {  // 定位結束：人就在店裡／站裡（150 公尺內）且夠準時自動選取
    mapStopLocate();
    if (!live() || !best) return;
    mapAddress(best);
    const acc = best.acc;
    mapMsg(acc > GOOD_ACC ? `定位精準度約 ±${Math.round(acc)} m，位置可能有偏差` : "", 5000);
    if (keep || MX.dragged || acc > GOOD_ACC) return;
    const near = MX.places.reduce((b, p) => { const d = distKm(best, p); return d < b[0] ? [d, p] : b; }, [0.15, null])[1];
    if (near) { mapSelect(near); $("#mapxRes").hidden = true; MX.map.setView([near.lat, near.lon], 17); }
  };
  MX.watch = navigator.geolocation.watchPosition(pos => {
    if (!live()) return mapStopLocate();
    const c = pos.coords;
    if (best && c.accuracy >= best.acc) return;
    best = MX.me = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, rough: c.accuracy > ROUGH_ACC };
    const ll = [best.lat, best.lon];
    MX.meM ||= L.circleMarker(ll, { radius: 7, color: "#fff", weight: 3, fillColor: "#3b82f6", fillOpacity: 1, interactive: false });
    MX.accC ||= L.circle(ll, { radius: 1, color: "#3b82f6", weight: 1, fillColor: "#3b82f6", fillOpacity: .12, interactive: false });
    MX.accC.setLatLng(ll).setRadius(best.acc).addTo(MX.map);
    MX.meM.setLatLng(ll).addTo(MX.map).bringToFront();
    mapMeChip();
    if (keep) mapSelect(MX.sel);  // 更新距離
    else if (!MX.dragged) {
      MX.map.setView(ll, best.rough ? 14 : 16);
      if (!MX.sel && !$("#mapxQ").value) mapNearby();
    }
    if (best.acc <= GOOD_ACC) settle();
    else mapMsg(`定位校正中…（精準度約 ±${Math.round(best.acc)} m）`);
  }, err => {
    if (!live()) return mapStopLocate();
    if (best) return settle();
    mapStopLocate();
    mapMeChip();
    mapMsg(err.code === 1 ? "未允許定位，請到瀏覽器設定開啟位置權限"
      : err.code === 2 ? "無法定位，請確認手機的定位服務（GPS）已開啟" : "GPS 訊號不足，請到戶外或稍後按 ◎ 再試", 6000);
  }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  MX.watchT = setTimeout(settle, 25000);
}

// 目前位置列：地址（OpenStreetMap 反查）＋精準度；點一下回到目前位置並列出附近的
function mapMeChip() {
  const b = $("#mapxMe"), me = MX.me;
  b.hidden = !me;
  if (me) b.innerHTML = `<span class="t">📍 <b>目前位置</b>　${esc(MX.addr || `${me.lat.toFixed(5)}, ${me.lon.toFixed(5)}`)}</span>
    <span class="a">±${Math.round(me.acc)} m</span>`;
}
async function mapAddress(me) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=zh-TW` +
      `&lat=${me.lat.toFixed(6)}&lon=${me.lon.toFixed(6)}`);
    const j = await r.json(), a = j.address || {};
    const no = a.house_number ? a.house_number.replace(/號?$/, "號") : "";
    const addr = [a.city || a.county, a.town || a.city_district || a.district || a.suburb, a.road, no].filter(Boolean).join("")
      || (j.display_name || "").split(",").map(x => x.trim()).filter(x => !/^\d{3,6}$/.test(x)).reverse().slice(1).join("");
    if (MX.me === me && addr) { MX.addr = addr; mapMeChip(); }
  } catch {}  // 查不到地址就顯示座標
}
$("#mapxMe").onclick = () => {
  if (!MX.me || !MX.map) return;
  MX.dragged = false;
  MX.map.setView([MX.me.lat, MX.me.lon], 17);
  mapNearby();
};
$("#mapxKind").onclick = e => {
  const b = e.target.closest("button[data-k]");
  if (b && b.dataset.k !== MX.kind) pickPlace(b.dataset.k, null, true);
};

function mapList(title, hits) {
  const res = $("#mapxRes");
  res.innerHTML = (title ? `<li style="cursor:default"><div class="a"><b>${esc(title)}</b></div></li>` : "") +
    (hits.length ? hits.map(([d, p], i) => `<li data-i="${i}"><div>${esc(p.label)}</div>
      <div class="a">${esc([p.addr, (MX.me?.rough ? "約 " : "") + distTxt(d)].filter(Boolean).join(" · "))}</div></li>`).join("")
    : `<li style="cursor:default"><div class="a">找不到符合的${MAP_KINDS[MX.kind].noun}</div></li>`);
  res.hidden = false;
  res.onclick = e => {
    const li = e.target.closest("li[data-i]");
    if (!li) return;
    const p = hits[li.dataset.i][1];
    res.hidden = true; $("#mapxQ").blur();
    MX.map.setView([p.lat, p.lon], 17);
    mapSelect(p);
  };
}
// 目前位置附近（依距離排序）
function mapNearby() {
  if (!MX.me) return;
  const hits = MX.places.map(p => [distKm(MX.me, p), p]).sort((a, b) => a[0] - b[0]).slice(0, 10);
  mapList(`📍 目前位置附近的${MAP_KINDS[MX.kind].noun}`, hits);
}

function mapSearch() {
  const q = norm($("#mapxQ").value.trim()), res = $("#mapxRes");
  if (!MX.map) return;
  if (!q) { if (MX.me) mapNearby(); else res.hidden = true; return; }
  const c = MX.map.getCenter(), ref = MX.me || { lat: c.lat, lon: c.lng };
  const hits = MX.places.filter(p => norm(`${p.label} ${p.addr || ""}`).includes(q))
    .map(p => [distKm(ref, p), p]).sort((a, b) => a[0] - b[0]).slice(0, 40);
  mapList("", hits);
}
function mapClose() { $("#mapx").hidden = true; mapMsg(""); mapStopLocate(); }
$("#mapxQ").oninput = mapSearch;
$("#mapxQ").onfocus = mapSearch;
$("#mapxQ").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#mapxQ").blur(); } };
$("#mapxClose").onclick = mapClose;
$("#mapxLoc").onclick = () => mapLocate(false);
$("#mapxUse").onclick = () => {
  if (!MX.sel) return;
  if (MX.browse) {
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${MX.sel.lat},${MX.sel.lon}`, "_blank");
    return;
  }
  MX.input.value = MX.sel.label;
  MX.input.dispatchEvent(new Event("change", { bubbles: true }));  // 加油站：重新判斷自助折扣
  mapClose();
};

// 手機端先檢查一次（離線時電腦無法檢查，暫存前就要擋下明顯的錯誤）
function need(ok, msg) { if (!ok) throw new Error(msg); }
const numv = v => { const x = parseFloat(String(v ?? "").replace(/,/g, "")); return isNaN(x) ? null : x; };
function odometerConflict(table, id, date, odo) {
  const rows = [...S.fuel.map(r => ({ ...r, t: "fuel" })), ...S.maint.map(r => ({ ...r, t: "maint" }))]
    .filter(r => !(r.t === table && r.id === id));
  const b = rows.find(r => (r.date < date && r.odometer > odo) || (r.date > date && r.odometer < odo));
  return b ? `這筆里程 ${n0(odo)} km 與 ${b.date} 的紀錄（${n0(b.odometer)} km）先後順序不一致。\n\n仍要儲存嗎？` : null;
}

// 新增／修改／刪除一律先放進暫存佇列再上傳：連得到電腦就立刻完成，連不到就等電腦開機後自動補傳
async function save(path, data, label, { odo, done = "已儲存，電腦上也會同步更新" } = {}) {
  if (odo) { const msg = odometerConflict(...odo); if (msg && !confirm(msg)) return null; }
  const id = enqueue(path, data, label);
  if (!OFFLINE) {
    if (flushing) await flushing;
    await flush();
  }
  const op = outbox().find(o => o.id === id);
  if (!op) { toast(RELAY ? "已送到雲端，電腦上網後會自動匯入" : done, RELAY ? 3500 : 2600); await load(true); return true; }
  if (op.error) { saveOutbox(outbox().filter(o => o.id !== id)); throw new Error(op.error); }
  if (!OFFLINE) OFFLINE = cachedState(VID)?.at || new Date().toISOString();
  toast(RELAY ? "目前沒有網路，已先存在手機，有網路時自動送出" : "電腦目前連不上，已先存在手機，連線後會自動上傳", 4500);
  render();
  return true;
}
async function remove(path, id, msg, label) {
  if (!confirm(msg)) return;
  try { if (await save(path, { id }, label, { done: "已刪除" })) closeSheet(); }
  catch (e) { $("#sheetErr").textContent = e.message; }
}
async function direct(path, body) {  // 車輛資料要拿到電腦給的編號，只能連線時操作
  try { return await api(path, body); }
  catch (e) { throw e.network ? new Error("新增、修改或刪除車輛需要連線到電腦，請等電腦開啟 MotoLog 後再操作") : e; }
}

// ---------------------------------------------------------------- 圖表（SVG，依容器寬度繪製）
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
function niceStep(span, n = 4) {
  const raw = span > 0 ? span / n : 1, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => raw <= s) || 10 * mag;
}
function yAxis(lo, hi, step, L, R, sy, dec = 0) {
  let out = "";
  for (let v = lo; v <= hi + 1e-9; v += step)
    out += `<line x1="${L}" x2="${R}" y1="${sy(v)}" y2="${sy(v)}" stroke="${css("grid")}"/>` +
      `<text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${(+v.toFixed(dec)).toLocaleString("zh-TW")}</text>`;
  return out;
}
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${body}</svg>`;

function drawCharts() {
  document.querySelectorAll("[data-chart]").forEach(el => {
    const w = Math.max(el.clientWidth - 16, 240);
    el.innerHTML = { eff: chartEff, monthly: chartMonthly, donut: chartDonut, yoy: chartYoy, price: chartPrice }[el.dataset.chart](w, el);
  });
}
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(drawCharts, 150); });

function chartEff(w) {
  const pts = S.fuel.filter(r => r.eff).slice(-30), h = 210, L = 40, R = w - 12, T = 14, B = h - 26;
  if (!pts.length) return `<div class="empty">需要至少兩次「加滿」的加油紀錄才能計算油耗</div>`;
  const vals = pts.map(p => p.eff), step = niceStep(Math.max(Math.max(...vals) - Math.min(...vals), 1));
  const lo = Math.floor(Math.min(...vals) / step) * step, hi = (Math.floor(Math.max(...vals) / step) + 1) * step;
  const sy = v => B - (v - lo) / (hi - lo) * (B - T), n = pts.length, sx = i => L + (R - L) * (n > 1 ? i / (n - 1) : .5);
  const line = pts.map((p, i) => `${sx(i)},${sy(p.eff)}`).join(" ");
  const avg = S.summary.avg, every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((R - L) / 56))));
  return svg(w, h, yAxis(lo, hi, step, L, R, sy) +
    (n > 1 ? `<polygon points="${L},${B} ${line} ${R},${B}" fill="${css("area")}"/><polyline points="${line}" fill="none" stroke="${css("primary")}" stroke-width="2.5" stroke-linejoin="round"/>` : "") +
    (avg ? `<line x1="${L}" x2="${R}" y1="${sy(avg)}" y2="${sy(avg)}" stroke="${css("amber")}" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${R}" y="${sy(avg) - 6}" text-anchor="end" style="fill:${css("avg-fg")}">平均 ${avg.toFixed(1)}</text>` : "") +
    pts.map((p, i) => `<circle cx="${sx(i)}" cy="${sy(p.eff)}" r="3.5" fill="${css("card")}" stroke="${css("primary")}" stroke-width="2"><title>${p.date}　${p.eff.toFixed(1)} km/L</title></circle>` +
      (i % every === 0 && n - 1 - i >= every / 2 || i === n - 1
        ? `<text x="${sx(i)}" y="${B + 17}" text-anchor="${i === n - 1 && n > 1 ? "end" : i === 0 ? "start" : "middle"}">${p.date.slice(5)}</text>` : "")).join("") +
    `<line x1="${L}" x2="${R}" y1="${B}" y2="${B}" stroke="${css("input")}"/>`);
}

function bars(w, labels, series, stacked, labelFn) {
  const h = 210, L = 44, R = w - 8, T = 18, B = h - 26;
  const totals = labels.map((_, i) => stacked ? series.reduce((a, s) => a + s.vals[i], 0) : Math.max(...series.map(s => s.vals[i])));
  const top = Math.max(...totals) || 100, step = niceStep(top, 3), hi = (Math.floor(top / step) + 1) * step;
  const sy = v => B - v / hi * (B - T), slot = (R - L) / labels.length;
  let out = yAxis(0, hi, step, L, R, sy);
  labels.forEach((lab, i) => {
    const cx = L + slot * (i + .5);
    if (stacked) {
      const bw = Math.min(slot * .6, 34); let acc = 0;
      series.forEach(s => { const v = s.vals[i]; if (v) out += `<rect x="${cx - bw / 2}" y="${sy(acc + v)}" width="${bw}" height="${sy(acc) - sy(acc + v)}" fill="${css(s.color)}" rx="2"><title>${lab} ${s.name} ${money(v)}</title></rect>`; acc += v; });
      if (totals[i] && slot > 40) out += `<text x="${cx}" y="${sy(totals[i]) - 5}" text-anchor="middle">${n0(totals[i])}</text>`;
    } else {
      const bw = Math.min(slot * .36, 16);
      series.forEach((s, k) => { const v = s.vals[i]; if (v) out += `<rect x="${cx - bw + k * bw}" y="${sy(v)}" width="${bw}" height="${B - sy(v)}" fill="${css(s.color)}" rx="2"><title>${s.name} ${lab} ${money(v)}</title></rect>`; });
    }
    out += `<text x="${cx}" y="${B + 17}" text-anchor="middle">${labelFn(lab, slot, i)}</text>`;
  });
  return svg(w, h, out + `<line x1="${L}" x2="${R}" y1="${B}" y2="${B}" stroke="${css("input")}"/>`);
}
function chartMonthly(w) {
  const ms = S.monthly;
  return bars(w, ms.map(m => m.month), [{ name: "油費", color: "primary", vals: ms.map(m => m.fuel) },
    { name: "保養", color: "amber", vals: ms.map(m => m.maint) }], true,
    (m, slot) => slot > 36 ? `${m.slice(2, 4)}/${m.slice(5)}` : +m.slice(5));
}
function chartYoy(w) {
  const p = S.pro, thisM = new Date().getMonth();
  return bars(w, [...Array(12).keys()].map(i => i + 1 + "月"), [{ name: p.year - 1, color: "muted", vals: p.yoy[p.year - 1] },
    { name: p.year, color: "primary", vals: p.yoy[p.year] }], false,
    (lab, slot, i) => `<tspan style="${i === thisM ? `fill:${css("text")};font-weight:700` : ""}">${slot > 34 ? lab : i + 1}</tspan>`);
}
function chartDonut(w) {
  const p = S.pro, f = p.fuel_cost, m = p.maint_cost, tot = f + m;
  if (!tot) return `<div class="empty">尚無花費紀錄</div>`;
  const r = 62, cx = 78, cy = 78, h = 156;
  const arc = (a0, a1, color) => {
    if (a1 - a0 >= 0.9999) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
    const p0 = [cx + r * Math.sin(a0 * 2 * Math.PI), cy - r * Math.cos(a0 * 2 * Math.PI)];
    const p1 = [cx + r * Math.sin(a1 * 2 * Math.PI), cy - r * Math.cos(a1 * 2 * Math.PI)];
    return `<path d="M${cx},${cy} L${p0} A${r},${r} 0 ${a1 - a0 > .5 ? 1 : 0} 1 ${p1} Z" fill="${color}" stroke="${css("card")}" stroke-width="2"/>`;
  };
  const lx = Math.min(cx + r + 26, w - 150);
  return svg(w, h, (f ? arc(0, f / tot, css("primary")) : "") + (m ? arc(f / tot, 1, css("amber")) : "") +
    `<circle cx="${cx}" cy="${cy}" r="${r * .62}" fill="${css("card")}"/>
    <text x="${lx}" y="${cy - 30}">總支出</text>
    <text x="${lx}" y="${cy - 8}" style="font-size:18px;font-weight:700;fill:${css("text")}">${money(tot)}</text>
    <rect x="${lx}" y="${cy + 12}" width="10" height="10" rx="2" fill="${css("primary")}"/>
    <text x="${lx + 16}" y="${cy + 21}" style="fill:${css("sub")}">油費 ${Math.round(f / tot * 100)}%　${money(f)}</text>
    <rect x="${lx}" y="${cy + 34}" width="10" height="10" rx="2" fill="${css("amber")}"/>
    <text x="${lx + 16}" y="${cy + 43}" style="fill:${css("sub")}">保養 ${Math.round(m / tot * 100)}%　${money(m)}</text>`);
}

function chartPrice(w, el) {
  const start = el.dataset.start, t = TODAY(), h = 240, L = 40, R = w - 12, T = 14, B = h - 26;
  const names = [["92無鉛", "ok"], ["95無鉛", "primary"], ["98無鉛", "violet"]];
  const series = names.map(([n, c]) => {
    const rows = (S.prices[n] || []).filter(([d]) => d >= start && d <= t);
    const first = priceOn(n, start);
    const pts = (first != null ? [[start, first]] : []).concat(rows.filter(([d]) => d > start));
    if (pts.length) pts.push([t, pts[pts.length - 1][1]]);
    return { n, c, pts };
  }).filter(s => s.pts.length);
  if (!series.length) return `<div class="empty">此區間沒有資料</div>`;
  const all = series.flatMap(s => s.pts.map(p => p[1]));
  const step = niceStep(Math.max(Math.max(...all) - Math.min(...all), 1));
  const lo = Math.floor(Math.min(...all) / step) * step, hi = (Math.floor(Math.max(...all) / step) + 1) * step;
  const t0 = new Date(start).getTime(), t1 = new Date(t).getTime();
  const sx = d => L + (new Date(d).getTime() - t0) / Math.max(t1 - t0, 1) * (R - L), sy = v => B - (v - lo) / (hi - lo) * (B - T);
  let out = yAxis(lo, hi, step, L, R, sy, 1);
  for (const s of series) {   // 階梯線：牌價在下次調價前維持不變
    let d = `M${sx(s.pts[0][0])},${sy(s.pts[0][1])}`;
    for (let i = 1; i < s.pts.length; i++) d += ` H${sx(s.pts[i][0])} V${sy(s.pts[i][1])}`;
    out += `<path d="${d}" fill="none" stroke="${css(s.c)}" stroke-width="2"/>`;
  }
  const ticks = Math.max(2, Math.floor((R - L) / 80));
  for (let i = 0; i <= ticks; i++) {
    const d = new Date(t0 + (t1 - t0) * i / ticks);
    out += `<text x="${L + (R - L) * i / ticks}" y="${B + 17}" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}">${histRange === "3m" ? `${d.getMonth() + 1}/${d.getDate()}` : `${String(d.getFullYear()).slice(2)}/${d.getMonth() + 1}`}</text>`;
  }
  out += `<line x1="${L}" x2="${R}" y1="${B}" y2="${B}" stroke="${css("input")}"/><g class="hover"></g>`;
  // 觸控／滑鼠：顯示該日三種油價
  setTimeout(() => {
    const s = el.querySelector("svg"), g = el.querySelector(".hover");
    if (!s) return;
    const show = ev => {
      const box = s.getBoundingClientRect(), x = Math.min(Math.max((ev.clientX - box.left) * w / box.width, L), R);
      const d = iso(new Date(t0 + (x - L) / (R - L) * (t1 - t0)));
      const lines = names.map(([n]) => [n, priceOn(n, d)]).filter(([, p]) => p != null);
      const bx = x > (L + R) / 2 ? x - 112 : x + 8;
      g.innerHTML = `<line x1="${x}" x2="${x}" y1="${T}" y2="${B}" stroke="${css("muted")}" stroke-dasharray="3 3"/>
        <rect x="${bx}" y="${T}" width="104" height="${22 + lines.length * 17}" rx="6" fill="${css("card")}" stroke="${css("border")}"/>
        <text x="${bx + 8}" y="${T + 16}" style="fill:${css("text")};font-weight:700">${d}</text>` +
        lines.map(([n, p], i) => `<text x="${bx + 8}" y="${T + 34 + i * 17}" style="fill:${css(names.find(x => x[0] === n)[1])}">${n.slice(0, 2)}　${p.toFixed(1)} 元</text>`).join("");
    };
    s.addEventListener("pointermove", show);
    s.addEventListener("pointerdown", show);
    s.addEventListener("pointerleave", () => g.innerHTML = "");
  });
  return svg(w, h, out);
}

// ---------------------------------------------------------------- 啟動
renderNav();
if (!location.hash || location.hash.startsWith("#k=")) history.replaceState(null, "", location.pathname + location.search + "#overview");
if (ready()) {
  const c = cachedState(VID);
  if (c) { S = c.st; CONNECTING = true; renderVehicles(); render(); }  // 先秀手機上的資料，不用乾等連線
  load(!!c);
} else showGate();
</script>
